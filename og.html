<!DOCTYPE html>
<!-- Шилтеме сүрөтү / Картинка для превью ссылки (assets/og.jpg, 1080×1080), вариант «Зумурут».
     Пересоздать: открыть через локальный сервер и сделать скриншот 1080×1080 (README). -->
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <title>OG</title>
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Spectral:ital,wght@0,300;1,300;1,400&family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { width: 1080px; height: 1080px; margin: 0; overflow: hidden; }
    body { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(70% 60% at 50% 48%, #17483b 0%, #0d2a23 62%, #071a15 100%); }
    body::before { content: ""; position: absolute; inset: 0; background: var(--deco); background-size: 84px 42px; }
    .fr { position: absolute; inset: 46px; opacity: 1; transform: none; }
    .fr .hero__corner { width: 120px; height: 120px; }
    .fr { background:
      linear-gradient(var(--gl), var(--gl)) 50% 4px / calc(100% - 232px) 2px no-repeat,
      linear-gradient(var(--gl), var(--gl)) 50% calc(100% - 4px) / calc(100% - 232px) 2px no-repeat,
      linear-gradient(var(--gl), var(--gl)) 4px 50% / 2px calc(100% - 232px) no-repeat,
      linear-gradient(var(--gl), var(--gl)) calc(100% - 4px) 50% / 2px calc(100% - 232px) no-repeat; }
    .c { position: relative; display: flex; flex-direction: column; align-items: center; }
    .f { width: 300px; height: 156px; }
    .k { margin-top: 26px; font-family: var(--sans); font-size: 21px; font-weight: 600; letter-spacing: .42em; padding-left: .42em; text-transform: uppercase; color: var(--gold); }
    .n { display: flex; flex-direction: column; align-items: center; margin: 22px 0 30px; font-family: var(--display); font-size: 128px; line-height: 1.02; }
    .n i { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 66px; line-height: 1; color: var(--gold); margin: 2px 0 6px; }
    .n .foil { animation: none; background-position: 30% 0; }
    .d { display: flex; align-items: center; gap: 30px; }
    .d span:not(.g) { width: 170px; padding: 12px 0; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); font-family: var(--sans); font-size: 20px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
    .d span:first-child { text-align: right; padding-right: 8px; } .d span:last-child { text-align: left; padding-left: 8px; }
    .g { position: relative; display: grid; place-items: center; width: 120px; height: 120px; margin: 0 12px; }
    .g::before, .g::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--gold); transform: rotate(45deg); }
    .g::after { inset: 10px; border-color: var(--line); background: rgba(28, 92, 74, .55); }
    .g b { position: relative; z-index: 1; font-family: var(--display); font-weight: 400; font-size: 64px; line-height: 1; color: var(--gold-hi); }
    .v { margin-top: 30px; font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 36px; color: var(--ivory); }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e2b6"/><stop offset=".45" stop-color="#d2b073"/><stop offset=".7" stop-color="#b38b4f"/><stop offset="1" stop-color="#e9d39e"/></linearGradient>
      <symbol id="corner" viewBox="0 0 80 80">
        <g fill="none" stroke="url(#gold)" stroke-width="1.2"><path d="M3 78 V22 H11 V11 H22 V3 H78"/><path d="M10 78 V28 H17 V17 H28 V10 H78" stroke-opacity=".55"/></g>
        <path d="M22 22 l5 -5 5 5 -5 5z" fill="url(#gold)"/>
      </symbol>
      <symbol id="fan" viewBox="0 0 200 104">
        <g fill="none" stroke="url(#gold)" stroke-linecap="round">
          <path d="M8 100 A92 92 0 0 1 192 100" stroke-width="1.4"/>
          <path d="M22 100 A78 78 0 0 1 178 100" stroke-width=".8" stroke-opacity=".6"/>
          <g id="fan-rays" stroke-width="1"></g>
          <path d="M70 100 A30 30 0 0 1 130 100" stroke-width="1.4"/>
        </g>
        <path d="M80 100 A20 20 0 0 1 120 100 Z" fill="url(#gold)" fill-opacity=".9"/>
      </symbol>
    </defs>
  </svg>
  <div class="hero__frame fr" aria-hidden="true">
    <svg class="hero__corner hero__corner--tl"><use href="#corner"/></svg>
    <svg class="hero__corner hero__corner--tr"><use href="#corner"/></svg>
    <svg class="hero__corner hero__corner--bl"><use href="#corner"/></svg>
    <svg class="hero__corner hero__corner--br"><use href="#corner"/></svg>
  </div>
  <div class="c">
    <svg class="f"><use href="#fan"/></svg>
    <p class="k">Үйлөнүү тойго чакыруу</p>
    <p class="n"><span class="foil">Элдияр</span><i>&amp;</i><span class="foil">Медина</span></p>
    <div class="d"><span>Ноябрь</span><span class="g"><b>13</b></span><span>2026</span></div>
    <p class="v">«Жетиген» рестораны · 17:00</p>
  </div>
  <script>
    (function () {
      var g = document.getElementById("fan-rays"), h = "";
      for (var i = 1; i < 18; i++) {
        var a = Math.PI * i / 18, c = Math.cos(a), s = Math.sin(a), r1 = 34, r2 = i % 2 ? 74 : 62;
        h += '<line x1="' + (100 - r1 * c).toFixed(1) + '" y1="' + (100 - r1 * s).toFixed(1) + '" x2="' + (100 - r2 * c).toFixed(1) + '" y2="' + (100 - r2 * s).toFixed(1) + '"/>';
      }
      g.innerHTML = h;
    })();
  </script>
</body>
</html>
